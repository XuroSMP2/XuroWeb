<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Events · XuroSMP</title><meta name="description" content="Alle kommenden und vergangenen Events auf XuroSMP.">
<meta name="theme-color" content="#120e1e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Cpath fill='%23ffaa00' d='M3 0h2v3h3v2H5v3H3V5H0V3h3z'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body data-page="events"><div class="page">
<h2>📅 Events</h2><p>Alle Zeiten in deutscher Zeit. Mit dem Kalender-Button speicherst du ein Event in deinem Kalender.</p>
<div class="fl" id="fl"></div><div id="up" class="grid"></div>
<h2 style="margin-top:36px">Vergangene Events</h2><div id="past" class="grid"></div></div>
<script src="config.js"></script><script src="common.js"></script>
<script>
let all=[],f='';
const draw=()=>{const ok=e=>!f||e.type===f,u=all.filter(e=>+XS.end(e)>Date.now()&&ok(e)).sort((x,y)=>!!y.pinned-!!x.pinned||new Date(x.start)-new Date(y.start)),p=all.filter(e=>+XS.end(e)<=Date.now()&&ok(e)).sort((x,y)=>new Date(y.start)-new Date(x.start));
$('#up').replaceChildren(...(u.length?u.map(XS.card):[h('p',{class:'mu'},'Keine kommenden Events in dieser Kategorie.')]));
$('#past').replaceChildren(...(p.length?p.map(XS.card):[h('p',{class:'mu'},'Noch keine vergangenen Events.')]))};
$('#fl').append(...[['','Alle'],...Object.entries(TY).map(([k,v])=>[k,v[0]])].map(([k,t])=>h('button',{class:k===''?'on':'',onclick:e=>{f=k;$$('#fl button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');draw()}},t)));
XS.load().then(a=>{all=a;draw()});
</script></body></html>
