<body data-page="events"><main class="page" id="inhalt">
<h1 class="t">Events</h1><p>Alle Zeiten in deutscher Zeit. Mit dem Kalender-Button speicherst du ein Event in deinem Kalender.</p>
<div class="fl" id="fl"></div><div id="up" class="grid"></div>
<h2 style="margin-top:36px">Vergangene Events</h2><div id="past" class="grid"></div></main>
<script src="config.js"></script><script src="common.js"></script>
<script>
let all=[],f='';
const draw=()=>{const ok=e=>!f||e.type===f,u=all.filter(e=>+XS.end(e)>Date.now()&&ok(e)).sort((x,y)=>!!y.pinned-!!x.pinned||new Date(x.start)-new Date(y.start)),p=all.filter(e=>+XS.end(e)<=Date.now()&&ok(e)).sort((x,y)=>new Date(y.start)-new Date(x.start));
$('#up').replaceChildren(...(u.length?u.map(XS.card):[h('p',{class:'mu'},'Keine kommenden Events in dieser Kategorie.')]));
$('#past').replaceChildren(...(p.length?p.map(XS.card):[h('p',{class:'mu'},'Noch keine vergangenen Events.')]))};
$('#fl').append(...[['','Alle'],...Object.entries(TY).map(([k,v])=>[k,v[0]])].map(([k,t])=>h('button',{class:k===''?'on':'',onclick:e=>{f=k;$$('#fl button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');draw()}},t)));
XS.load().then(a=>{all=a;draw()});
</script></body></html>
