[build]
  publish = "public"
  functions = "netlify/functions"
  command = "node build.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.mcsrvstat.us https://api.mcstatus.io https://discord.com https://api.github.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/pack/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"


# Downloads: Die Adresse bleibt auf dieser Seite, die Datei kommt direkt aus dem neuesten Release.
[[redirects]]
  from = "/client/XuroClient-Windows.zip"
  to = "https://github.com/XuroSMP2/XuroClient/releases/latest/download/XuroClient-Windows.zip"
  status = 302
  force = true

[[redirects]]
  from = "/client/XuroClient-macOS.zip"
  to = "https://github.com/XuroSMP2/XuroClient/releases/latest/download/XuroClient-macOS.zip"
  status = 302
  force = true

[[redirects]]
  from = "/client/XuroClient-Linux.zip"
  to = "https://github.com/XuroSMP2/XuroClient/releases/latest/download/XuroClient-Linux.zip"
  status = 302
  force = true
